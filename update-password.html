<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Ogritech | Nova senha</title>
    <link rel="icon" href="ogritech-favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="ogritech-symbol.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-wrapper">
        <section class="login-card">
            <img
                src="ogritech-logo.png"
                alt="SaaS Ogritech"
                class="login-wordmark"
            >

            <p class="eyebrow platform-eyebrow">GESTÃO INTELIGENTE PARA BARBEARIAS</p>
            <h1 class="login-title">Definir nova senha</h1>
            <p class="login-subtitle">
                Digite e confirme sua nova senha de acesso.
            </p>

            <form id="updatePasswordForm" class="login-form hidden">
                <label>
                    Nova senha
                    <input
                        type="password"
                        id="newPassword"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <label>
                    Confirmar nova senha
                    <input
                        type="password"
                        id="confirmPassword"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <p id="updatePasswordMessage" class="login-message">
                    Validando seu link de recuperação...
                </p>

                <button type="submit" class="gold-button full">
                    Salvar nova senha
                </button>
            </form>

            <p id="invalidRecoveryMessage" class="login-message">
                Validando seu link de recuperação...
            </p>

            <a href="login.html" class="text-button full">
                Voltar ao login
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="update-password.js"></script>
</body>
</html>

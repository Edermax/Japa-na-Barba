<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://mvzcoaiiwytycdqcvydf.supabase.co wss://mvzcoaiiwytycdqcvydf.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Ogritech | Nova senha</title>
    <link rel="icon" href="ogritech-favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="ogritech-brand-symbol.png">
    <link rel="apple-touch-icon" href="ogritech-brand-symbol.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-wrapper">
        <section class="login-card">
            <a class="ogritech-lockup header-logo-link" href="./" aria-label="Ir para a página principal da Ogritech">
                <img src="ogritech-brand-symbol.png" alt="" class="ogritech-lockup-symbol">
                <img src="ogritech-logo.png" alt="Ogritech" class="ogritech-lockup-name">
            </a>

            <p class="eyebrow platform-eyebrow">GESTÃO INTELIGENTE PARA BARBEARIAS</p>
            <h1 class="login-title">Definir nova senha</h1>
            <p class="login-subtitle">
                Digite e confirme sua nova senha de acesso.
            </p>

            <form id="updatePasswordForm" class="login-form hidden">
                <label>
                    Nova senha
                    <input
                        type="password"
                        id="newPassword"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <label>
                    Confirmar nova senha
                    <input
                        type="password"
                        id="confirmPassword"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <p id="updatePasswordMessage" class="login-message">
                    Validando seu link de recuperação...
                </p>

                <button type="submit" class="gold-button full">
                    Salvar nova senha
                </button>
            </form>

            <p id="invalidRecoveryMessage" class="login-message">
                Validando seu link de recuperação...
            </p>

            <a href="login.html" class="text-button full">
                Voltar ao login
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="supabase-config.js"></script>
    <script src="update-password.js"></script>
    <script src="pwa.js"></script>
</body>
</html>

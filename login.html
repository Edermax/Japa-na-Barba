<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Codificação para acentos e caracteres especiais -->
    <meta charset="UTF-8">

    <!-- Responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título exibido na aba do navegador -->
    <title>SaaS Ogritech | Login</title>
    <link rel="icon" href="ogritech-favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="ogritech-symbol.png">

    <!-- CSS principal do sistema -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <!-- =====================================================
         TELA DE LOGIN

         IMPORTANTE:
         O usuário não precisa escolher visualmente o seu perfil.

         O JavaScript identifica automaticamente se o acesso é de:
         - Proprietário
         - Funcionário
         - Cliente

         Isso acontece através do e-mail e senha informados.
         ===================================================== -->
    <main class="login-wrapper">

        <section class="login-card">

            <!-- Marca da plataforma -->
            <img
                src="ogritech-logo.png"
                alt="SaaS Ogritech"
                class="login-wordmark"
            >

            <!-- Identidade da tela -->
            <p class="eyebrow platform-eyebrow">GESTÃO INTELIGENTE PARA NEGÓCIOS</p>
            <h1 class="login-title">Acessar sistema</h1>

            <p class="login-subtitle">
                Entre com seu e-mail e senha.
            </p>

            <p class="login-subtitle"><a href="demonstracoes.html">Ver demonstrações por segmento</a></p>

            <!-- =================================================
                 FORMULÁRIO DE LOGIN
                 ================================================= -->
            <form id="loginForm" class="login-form">

                <!-- Campo de e-mail -->
                <label>
                    E-mail

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </label>

                <!-- Campo de senha -->
                <label>
                    Senha

                    <span class="password-field">
                        <input
                            type="password"
                            id="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            id="togglePasswordButton"
                            class="password-toggle"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                            title="Mostrar senha"
                        >
                            <span aria-hidden="true">◉</span>
                        </button>
                    </span>
                </label>

                <!-- Mensagem de erro ou sucesso -->
                <p id="loginMessage" class="login-message"></p>

                <!-- Botão de entrada -->
                <button
                    type="submit"
                    class="gold-button full"
                >
                    Entrar
                </button>

                <button
                    type="button"
                    id="forgotPasswordButton"
                    class="text-button full"
                >
                    Esqueci minha senha
                </button>

            </form>

        </section>

    </main>

    <!-- Cliente oficial do Supabase e configuração pública do projeto -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <!-- Lógica do login -->
    <script src="login.js"></script>

</body>
</html>

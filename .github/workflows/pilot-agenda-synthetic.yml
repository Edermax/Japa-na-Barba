name: Piloto sintético da agenda — 14 dias

on:
  schedule:
    - cron: "37 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pilot-agenda-synthetic
  cancel-in-progress: false

env:
  PILOT_START: "2026-09-01"
  PILOT_END: "2026-09-14"

jobs:
  simulated-day:
    name: Simular dia de operação no staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Check the 14-day window
        id: window
        shell: bash
        run: |
          today="$(TZ=America/Sao_Paulo date +%F)"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || ( "$today" < "${PILOT_END}" || "$today" == "${PILOT_END}" ) && ( "$today" > "${PILOT_START}" || "$today" == "${PILOT_START}" ) ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Fora da janela do piloto: $today"
          fi

      - uses: actions/checkout@v5
        if: steps.window.outputs.should_run == 'true'
      - uses: actions/setup-node@v5
        if: steps.window.outputs.should_run == 'true'
        with: { node-version: 22 }

      - name: Verify the published booking interface
        id: ui
        if: steps.window.outputs.should_run == 'true'
        continue-on-error: true
        env:
          AGENDA_UI_REPORT: evidence/public-ui-${{ github.run_number }}.json
        run: npm run test:agenda-ui-smoke

      - name: Run assisted synthetic day
        id: pilot
        if: steps.window.outputs.should_run == 'true' && steps.ui.outcome == 'success'
        continue-on-error: true
        env:
          AGENDA_PILOT_REPORT: evidence/pilot-day-${{ github.run_number }}.json
        run: npm run test:agenda-pilot-day

      - name: Archive daily evidence
        if: steps.window.outputs.should_run == 'true' && steps.pilot.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: agenda-pilot-day-${{ github.run_number }}
          path: evidence/*.json
          retention-days: 30

      - name: Update the 14-day pilot diary
        if: steps.window.outputs.should_run == 'true' && steps.pilot.outcome == 'success'
        uses: actions/github-script@v8
        env:
          REPORT_PATH: evidence/pilot-day-${{ github.run_number }}.json
          PILOT_DATE: ${{ steps.window.outputs.today }}
          PILOT_END_DATE: ${{ env.PILOT_END }}
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
            const title = "[Piloto sintético] Diário operacional da agenda — 14 dias";
            const label = "synthetic-agenda-pilot-log";
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "23735b",
                description: "Diário e evidências do piloto sintético da agenda"
              });
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: "all", labels: label, per_page: 20
            });
            let diary = issues.find((issue) => issue.title === title);
            if (!diary) {
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                labels: [label],
                body: "Registro automático do ciclo de 01 a 14/09/2026. Cada comentário corresponde a um dia executado no staging; este diário não autoriza produção."
              });
              diary = created.data;
            } else if (diary.state === "closed") {
              await github.rest.issues.update({ ...context.repo, issue_number: diary.number, state: "open" });
            }
            const { data: dailyComments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: diary.number, per_page: 100
            });
            const dailyHeading = `### ${process.env.PILOT_DATE} — aprovado`;
            const existingDaily = dailyComments.some((comment) => comment.body?.includes(dailyHeading));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              dailyHeading,
              `- Clientes simulados: ${report.clientsSimulated}`,
              `- Reservas criadas/canceladas: ${report.bookingsCreated}/${report.bookingsCancelled}`,
              `- Isolamento entre clientes: ${report.crossClientIsolation}`,
              `- Limpeza: ${report.cleanup}`,
              `- Requisições medidas: ${report.requestsMeasured}`,
              `- p95: ${report.p95Ms} ms`,
              `- [Execução e artefato](${runUrl})`
            ].join("\n");
            if (existingDaily) {
              core.notice(`O diário já contém uma execução aprovada para ${process.env.PILOT_DATE}; comentário duplicado suprimido.`);
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: diary.number, body });
            }
            if (process.env.PILOT_DATE === process.env.PILOT_END_DATE) {
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo, issue_number: diary.number, per_page: 100
              });
              const { parseDiaryComment, summarizePilotEntries } = require("./scripts/pilot-diary-summary.cjs");
              const entries = comments.map((comment) => parseDiaryComment(comment.body));
              const { data: incidents } = await github.rest.issues.listForRepo({
                ...context.repo, state: "open", labels: "synthetic-agenda-pilot", per_page: 20
              });
              const summary = summarizePilotEntries(entries, { openIncidents: incidents.length });
              const verdict = summary.approved ? "APROVADO TECNICAMENTE" : "NÃO APROVADO";
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: diary.number,
                body: [
                  `## Encerramento — ${verdict}`,
                  `- Dias únicos aprovados: ${summary.uniqueDays}/${summary.expectedDays}`,
                  `- Reservas criadas/canceladas: ${summary.totalCreated}/${summary.totalCancelled}`,
                  `- Maior p95 diário: ${summary.maxP95Ms} ms`,
                  `- Dias com falha de isolamento ou limpeza: ${summary.unsafeDays.length ? summary.unsafeDays.join(", ") : "0"}`,
                  `- Incidentes abertos: ${summary.openIncidents}`,
                  summary.approved
                    ? "Pronto para avaliação do beta fechado; produção continua dependendo de autorização explícita."
                    : "O diário permanecerá aberto até que as pendências sejam tratadas e um novo ciclo seja aprovado."
                ].join("\n")
              });
              if (summary.approved) {
                await github.rest.issues.update({ ...context.repo, issue_number: diary.number, state: "closed" });
              }
            }

      - name: Publish or resolve pilot incident
        if: steps.window.outputs.should_run == 'true'
        uses: actions/github-script@v8
        env:
          PILOT_OUTCOME: ${{ steps.pilot.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
        with:
          script: |
            const title = "[Piloto sintético] Falha na simulação diária da agenda";
            const label = "synthetic-agenda-pilot";
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "b42318",
                description: "Falha no ciclo sintético diário da agenda"
              });
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: label, per_page: 10
            });
            const incident = issues.find((issue) => issue.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (process.env.PILOT_OUTCOME !== "success" || process.env.UI_OUTCOME !== "success") {
              const body = `A verificação da interface publicada ou a simulação diária da agenda no staging falhou.\n\nInterface: ${process.env.UI_OUTCOME}\nSimulação: ${process.env.PILOT_OUTCOME}\n\nExecução: ${runUrl}`;
              if (incident) await github.rest.issues.createComment({ ...context.repo, issue_number: incident.number, body });
              else await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
              core.setFailed("A simulação diária da agenda falhou.");
            } else if (incident) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: incident.number,
                body: `A simulação diária voltou ao normal. Execução: ${runUrl}`
              });
              await github.rest.issues.update({ ...context.repo, issue_number: incident.number, state: "closed" });
            }
